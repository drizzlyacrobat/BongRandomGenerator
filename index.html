<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BongTools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f3f6fb; color: #111;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; flex-direction: column; gap: 20px;
      padding: 60px 16px 40px;
    }
    body.dark { background: #0f1117; color: #e8eaf0; }
    body.dark .box { background: #1a1d27; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    body.dark input, body.dark textarea { background: #252836; border-color: #3a3f55; color: #e8eaf0; }
    body.dark input:focus, body.dark textarea:focus { border-color: #2899f5; }
    body.dark input::placeholder, body.dark textarea::placeholder { color: #666e8a; }

    .toggle-btn {
      position: fixed; top: 16px; right: 16px; background: none;
      border: 1.5px solid #d0d7e2; border-radius: 50px; padding: 6px 14px;
      cursor: pointer; font-size: 14px; font-weight: 600; color: #444;
      display: flex; align-items: center; gap: 6px; width: auto;
    }
    .toggle-btn:hover { background: #e8eef8; }
    body.dark .toggle-btn { border-color: #3a3f55; color: #aab0c8; background: none; }
    body.dark .toggle-btn:hover { background: #252836; }

    .coming-soon {
      font-weight: 700; color: #fff;
      background: linear-gradient(90deg, #0078d4, #2899f5);
      padding: 10px 20px; border-radius: 12px; font-size: 18px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    .box {
      background: #fff; border-radius: 14px; width: 100%; max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; overflow: visible;
    }

    .tabs { display: flex; border-bottom: 1px solid #e4e8f0; border-radius: 14px 14px 0 0; overflow: hidden; }
    body.dark .tabs { border-bottom-color: #2a2e3d; }
    .tab {
      flex: 1; padding: 13px 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; background: none; color: #888;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 0.2s, background 0.2s;
    }
    .tab:hover { background: #f3f6fb; color: #444; }
    body.dark .tab:hover { background: #252836; color: #ccc; }
    .tab.active { color: #0078d4; border-bottom: 2px solid #0078d4; background: none; }
    body.dark .tab.active { color: #2899f5; border-bottom-color: #2899f5; }

    .tab-panel { display: none; padding: 24px; flex-direction: column; }
    .tab-panel.active { display: flex; }

    h2 { margin-top: 0; margin-bottom: 20px; font-weight: 600; }

    .inputs { display: flex; gap: 10px; margin-bottom: 16px; }
    input[type="number"] {
      width: 100%; padding: 10px; font-size: 15px; border-radius: 10px;
      border: 1px solid #d0d7e2; outline: none; background: #fff; color: #111;
    }
    input[type="number"]:focus { border-color: #0078d4; }

    button.action-btn {
      width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      border-radius: 10px; border: none; cursor: pointer;
      background: #0078d4; color: white; transition: background 0.2s;
    }
    button.action-btn:hover { background: #106ebe; }
    button.action-btn:disabled { background: #7ab5e0; cursor: not-allowed; }

    #result { margin-top: 18px; font-size: 32px; font-weight: 700; min-height: 40px; color: #0078d4; }
    body.dark #result { color: #2899f5; }
    .error { color: #d13438; font-size: 16px; }

    /* Coin */
    .coin-scene { perspective: 600px; width: 100px; height: 100px; margin: 8px auto 0; }
    .coin { width: 100px; height: 100px; position: relative; transform-style: preserve-3d; }
    .coin.land-heads { transform: rotateY(0deg); }
    .coin.land-tails  { transform: rotateY(180deg); }
    .coin.flipping { animation: coinFlip 0.9s cubic-bezier(0.4,0,0.2,1) forwards; }
    @keyframes coinFlip {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      30%  { transform: rotateY(540deg) rotateX(20deg) translateY(-30px); }
      70%  { transform: rotateY(1080deg) rotateX(10deg) translateY(-10px); }
      100% { transform: rotateY(var(--end-rot,0deg)) rotateX(0deg); }
    }
    .coin-face {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      backface-visibility: hidden; display: flex; align-items: center;
      justify-content: center; font-size: 38px; font-weight: 800;
      border: 4px solid rgba(0,0,0,0.08);
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 10px rgba(255,255,255,0.3);
    }
    .coin-heads { background: linear-gradient(135deg,#f7c948,#e6a817); color: #7a4a00; }
    .coin-tails  { background: linear-gradient(135deg,#d4d8e0,#b0b6c2); color: #3a3f55; transform: rotateY(180deg); }
    #coin-label { margin-top: 14px; font-size: 22px; font-weight: 700; min-height: 28px; color: #0078d4; }
    body.dark #coin-label { color: #2899f5; }
    #flip-btn { margin-top: 18px; }

    /* Magic 8 Ball */
    #panel-magic { align-items: center; padding: 16px 16px 20px; }
    #panel-magic h2 { margin-bottom: 6px; }

    /* Physics arena */
    #magic-arena {
      width: 100%; aspect-ratio: 1 / 0.75;
      border-radius: 12px;
      background: #0a0a14;
      position: relative; overflow: visible;
      cursor: grab; touch-action: none;
      border: 1.5px solid #1e2035;
      margin-bottom: 4px;
      margin-top: 8px;
    }
    body.dark #magic-arena { background: #05050e; border-color: #1a1c2c; }
    #magic-arena:active { cursor: grabbing; }

    /* Subtle grid floor */
    #magic-arena::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    #ball-el {
      position: absolute;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #3d3d3d, #000 72%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.8),
        inset 0 -4px 12px rgba(255,255,255,0.04),
        inset 5px 5px 16px rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center;
      user-select: none; cursor: grab;
      will-change: transform;
      touch-action: none;
    }
    #ball-el:active { cursor: grabbing; }

    /* Gloss */
    #ball-el::before {
      content: '';
      position: absolute; top: 12px; left: 20px;
      width: 36px; height: 20px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.18) 0%, transparent 70%);
      transform: rotate(-20deg);
      pointer-events: none;
    }

    .ball-window-inner {
      width: 54px; height: 54px; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #1a1aff, #000080 60%, #00004a);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), inset 0 1px 4px rgba(0,0,0,0.6);
    }

    .magic-answer-inner {
      font-size: 9px; font-weight: 700; color: #a0c8ff;
      text-align: center; padding: 3px; line-height: 1.2;
      text-transform: uppercase; letter-spacing: 0.3px;
      max-width: 46px;
      opacity: 0;
      transition: opacity 0.5s ease 0.1s;
    }
    .magic-answer-inner.visible { opacity: 1; }

    /* Answer overlay above arena */
    #magic-answer-overlay {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); backdrop-filter: blur(6px);
      border-radius: 20px; padding: 4px 12px;
      font-size: 11px; font-weight: 700; color: #a0c8ff;
      text-transform: uppercase; letter-spacing: 0.8px;
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.4s;
    }
    #magic-answer-overlay.visible { opacity: 1; }

    /* Shadow under ball */
    #ball-shadow {
      position: absolute;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      filter: blur(6px);
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .magic-input-row {
      display: flex; gap: 8px; width: 100%; margin-top: 10px;
    }
    .magic-input-row input {
      flex: 1; padding: 10px 12px; font-size: 14px; border-radius: 10px;
      border: 1px solid #d0d7e2; outline: none; background: #fff; color: #111;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .magic-input-row input:focus { border-color: #0078d4; }
    body.dark .magic-input-row input { background: #252836; border-color: #3a3f55; color: #e8eaf0; }

    .magic-input-row button {
      padding: 10px 16px; font-size: 14px; font-weight: 600;
      border-radius: 10px; border: none; cursor: pointer;
      background: #0078d4; color: white; white-space: nowrap;
      transition: background 0.2s; width: auto;
    }
    .magic-input-row button:hover { background: #106ebe; }
    .magic-input-row button:disabled { background: #7ab5e0; cursor: not-allowed; }

    .magic-hint {
      font-size: 12px; color: #aaa; margin-top: 8px;
    }
    body.dark .magic-hint { color: #555; }

    .magic-category {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; margin-top: 6px; min-height: 16px;
      transition: color 0.3s;
    }
    .cat-positive { color: #27ae60; }
    .cat-neutral  { color: #e67e22; }
    .cat-negative { color: #e74c3c; }

    /* Shake toast notification */
    .shake-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1a1d27; color: #e8eaf0; padding: 10px 20px;
      border-radius: 50px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; white-space: nowrap; z-index: 999;
    }
    .shake-toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* Shake permission button */
    .shake-permission-btn {
      margin-top: 10px; padding: 7px 16px; font-size: 12px; font-weight: 600;
      border-radius: 50px; border: 1.5px solid #0078d4; cursor: pointer;
      background: none; color: #0078d4; transition: background 0.2s, color 0.2s;
      display: none;
    }
    .shake-permission-btn:hover { background: #0078d4; color: #fff; }
    body.dark .shake-permission-btn { border-color: #2899f5; color: #2899f5; }
    body.dark .shake-permission-btn:hover { background: #2899f5; color: #fff; }
    .shake-permission-btn.visible { display: inline-block; }

    /* Shake indicator ring on ball */
    .ball-wrap.device-shake-active .ball-outer {
      box-shadow:
        0 8px 32px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.3),
        inset 0 -6px 18px rgba(255,255,255,0.04),
        inset 6px 6px 20px rgba(255,255,255,0.07),
        0 0 0 3px #2899f5, 0 0 16px rgba(40,153,245,0.5);
    }
  </style>
</head>
<body>
  <button class="toggle-btn" onclick="toggleDark()" id="toggleBtn">🌙 Dark</button>
  <div class="coming-soon">BongTools V2 – Coming Soon 🚀</div>

  <div class="box">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('number', this)">🔢 Number</button>
      <button class="tab" onclick="switchTab('coin', this)">🪙 Coin Flip</button>
      <button class="tab" onclick="switchTab('magic', this)">🎱 Magic 8</button>
    </div>

    <!-- Number Generator -->
    <div class="tab-panel active" id="panel-number">
      <h2>Number Generator</h2>
      <div class="inputs">
        <input id="min" type="number" placeholder="Minimum">
        <input id="max" type="number" placeholder="Maximum">
      </div>
      <button class="action-btn" onclick="generate()">Generate</button>
      <div id="result">—</div>
    </div>

    <!-- Coin Flip -->
    <div class="tab-panel" id="panel-coin">
      <h2>Coin Flip</h2>
      <div class="coin-scene">
        <div class="coin land-heads" id="coin">
          <div class="coin-face coin-heads">H</div>
          <div class="coin-face coin-tails">T</div>
        </div>
      </div>
      <div id="coin-label">—</div>
      <button class="action-btn" id="flip-btn" onclick="flipCoin()">Flip Coin</button>
    </div>

    <!-- Magic 8 Ball -->
    <div class="tab-panel" id="panel-magic">
      <h2>🎱 Magic 8 Ball</h2>

      <div id="magic-arena">
        <div id="ball-shadow"></div>
        <div id="ball-el">
          <div class="ball-window-inner">
            <div class="magic-answer-inner" id="magic-answer">8</div>
          </div>
        </div>
        <div id="magic-answer-overlay"></div>
      </div>

      <div class="magic-category" id="magic-category"></div>

      <div class="magic-input-row">
        <input type="text" id="magic-question" placeholder="Ask your question…" onkeydown="if(event.key==='Enter') triggerAsk()">
        <button id="magic-btn" onclick="triggerAsk()">Ask</button>
      </div>

      <button class="shake-permission-btn" id="shake-permission-btn" onclick="requestShakePermission()">
        📳 Enable Device Shake
      </button>

      <div class="magic-hint" id="magic-hint">Drag & throw the ball — or shake your device</div>
    </div>
  </div>

  <!-- Toast for shake feedback -->
  <div class="shake-toast" id="shake-toast">📳 Shake detected!</div>

  <script>
    const ANSWERS = [
      { text: "It is certain",        cat: "positive" },
      { text: "It is decidedly so",   cat: "positive" },
      { text: "Without a doubt",      cat: "positive" },
      { text: "Yes, definitely",      cat: "positive" },
      { text: "You may rely on it",   cat: "positive" },
      { text: "As I see it, yes",     cat: "positive" },
      { text: "Most likely",          cat: "positive" },
      { text: "Outlook good",         cat: "positive" },
      { text: "Yes",                  cat: "positive" },
      { text: "Signs point to yes",   cat: "positive" },
      { text: "Reply hazy, try again",cat: "neutral"  },
      { text: "Ask again later",      cat: "neutral"  },
      { text: "Better not tell you",  cat: "neutral"  },
      { text: "Cannot predict now",   cat: "neutral"  },
      { text: "Concentrate and ask again", cat: "neutral" },
      { text: "Don't count on it",    cat: "negative" },
      { text: "My reply is no",       cat: "negative" },
      { text: "My sources say no",    cat: "negative" },
      { text: "Outlook not so good",  cat: "negative" },
      { text: "Very doubtful",        cat: "negative" },
    ];

    const CAT_COLORS = { positive: "#27ae60", neutral: "#e67e22", negative: "#e74c3c" };

    // ── Physics Ball ───────────────────────────────────────────────────────────
    const BALL_R      = 60;
    const SPRING_K    = 0.10;  // spring pull toward center
    const SPRING_DAMP = 0.75;  // damping (lower = bouncier return)
    const SETTLE_DIST = 0.5;   // px from center to snap
    const SETTLE_SPD  = 0.4;

    const arena   = document.getElementById("magic-arena");
    const ballEl  = document.getElementById("ball-el");
    const shadowEl= document.getElementById("ball-shadow");

    let bx, by, vx = 0, vy = 0;
    let dragging = false;
    let dragOffX, dragOffY;
    let prevDragX, prevDragY, prevDragT;
    let rafId = null;
    let answerRevealed = false;
    let settleTimer = null;
    let returning = false;

    function arenaSize() {
      return { w: arena.clientWidth, h: arena.clientHeight };
    }

    function initBallPos() {
      const { w, h } = arenaSize();
      bx = w / 2;
      by = h / 2;
      vx = 0; vy = 0;
      returning = false;
      renderBall();
    }

    function renderBall() {
      const { w, h } = arenaSize();
      ballEl.style.left = (bx - BALL_R) + "px";
      ballEl.style.top  = (by - BALL_R) + "px";

      // Shadow shrinks the further the ball is from center
      const cx = w / 2, cy = h / 2;
      const dist = Math.hypot(bx - cx, by - cy);
      const maxDist = Math.hypot(cx, cy);
      const t = Math.min(dist / maxDist, 1);
      const scale = 1 - t * 0.55;
      const sw = BALL_R * 2 * scale;
      const sh = BALL_R * 0.35 * scale;
      shadowEl.style.width   = sw + "px";
      shadowEl.style.height  = sh + "px";
      shadowEl.style.left    = (bx - sw / 2) + "px";
      shadowEl.style.top     = (by + BALL_R * 0.75 - sh / 2) + "px";
      shadowEl.style.opacity = (0.15 + 0.28 * scale).toString();
    }

    function physicsStep() {
      if (dragging) { renderBall(); rafId = requestAnimationFrame(physicsStep); return; }

      const { w, h } = arenaSize();
      const cx = w / 2, cy = h / 2;

      // Spring toward center
      vx = (vx + (cx - bx) * SPRING_K) * SPRING_DAMP;
      vy = (vy + (cy - by) * SPRING_K) * SPRING_DAMP;
      bx += vx;
      by += vy;

      renderBall();

      const distToCenter = Math.hypot(bx - cx, by - cy);
      const speed = Math.sqrt(vx * vx + vy * vy);

      if (distToCenter < SETTLE_DIST && speed < SETTLE_SPD) {
        bx = cx; by = cy; vx = 0; vy = 0;
        renderBall();
        rafId = null;
        if (returning) {
          returning = false;
          revealAnswer();
        }
        return;
      }

      rafId = requestAnimationFrame(physicsStep);
    }

    function startPhysics() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(physicsStep);
    }

    function getEventPos(e) {
      if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function onPointerDown(e) {
      e.preventDefault();
      const rect = arena.getBoundingClientRect();
      const { x, y } = getEventPos(e);
      const lx = x - rect.left;
      const ly = y - rect.top;
      // Hit-test: only drag if within the ball
      if (Math.hypot(lx - bx, ly - by) > BALL_R + 8) return;

      dragging = true;
      dragOffX = lx - bx;
      dragOffY = ly - by;
      prevDragX = lx; prevDragY = ly; prevDragT = Date.now();
      vx = 0; vy = 0;

      // Hide answer when picked up
      hideAnswer();

      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(physicsStep);
      ballEl.style.transition = 'none';
    }

    function onPointerMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const rect = arena.getBoundingClientRect();
      const { x, y } = getEventPos(e);
      const lx = x - rect.left;
      const ly = y - rect.top;

      const now = Date.now();
      const dt  = Math.max(1, now - prevDragT);

      // Velocity from drag (px/frame at 60fps)
      vx = (lx - prevDragX) / dt * 16;
      vy = (ly - prevDragY) / dt * 16;

      prevDragX = lx; prevDragY = ly; prevDragT = now;

      bx = lx - dragOffX;
      by = ly - dragOffY;

      // Clamp inside arena
      const { w, h } = arenaSize();
      bx = Math.max(BALL_R, Math.min(w - BALL_R, bx));
      by = Math.max(BALL_R, Math.min(h - BALL_R, by));
    }

    function onPointerUp(e) {
      if (!dragging) return;
      dragging = false;

      const { w, h } = arenaSize();
      const cx = w / 2, cy = h / 2;
      const distFromCenter = Math.hypot(bx - cx, by - cy);

      // If dragged far enough from center, spring back and reveal answer on arrival
      if (distFromCenter > BALL_R * 0.5) {
        returning = true;
        hideAnswer();
      }

      vx *= 0.3; vy *= 0.3; // kill throw momentum — we want smooth spring return
      startPhysics();
    }

    // Mouse events
    arena.addEventListener("mousedown",  onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup",   onPointerUp);

    // Touch events
    arena.addEventListener("touchstart", onPointerDown, { passive: false });
    window.addEventListener("touchmove", onPointerMove, { passive: false });
    window.addEventListener("touchend",  onPointerUp);

    // Click on ball when not dragging → trigger answer
    ballEl.addEventListener("click", () => {
      if (Math.abs(vx) < 0.5 && Math.abs(vy) < 0.5) {
        triggerAsk();
      }
    });

    // Reveal / hide answer
    function revealAnswer() {
      if (answerRevealed) return;
      answerRevealed = true;
      const pick = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
      document.getElementById("magic-answer").textContent  = pick.text;
      document.getElementById("magic-answer").classList.add("visible");

      const overlay = document.getElementById("magic-answer-overlay");
      overlay.textContent = pick.text;
      overlay.classList.add("visible");

      const catEl = document.getElementById("magic-category");
      catEl.textContent  = pick.cat.toUpperCase();
      catEl.style.color  = CAT_COLORS[pick.cat];
    }

    function hideAnswer() {
      answerRevealed = false;
      document.getElementById("magic-answer").classList.remove("visible");
      document.getElementById("magic-answer").textContent = "8";
      document.getElementById("magic-answer-overlay").classList.remove("visible");
      document.getElementById("magic-category").textContent = "";
    }

    // "Ask" button / click: fling ball out then spring back → reveal on return
    function triggerAsk() {
      hideAnswer();
      returning = true;
      vx = (Math.random() - 0.5) * 16;
      vy = (Math.random() - 0.5) * 16;
      startPhysics();
    }

    // ── Shake toast ────────────────────────────────────────────────────────────
    let toastTimer = null;
    function showShakeToast() {
      const toast = document.getElementById("shake-toast");
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function shake8Ball(fromDevice) {
      if (fromDevice) showShakeToast();
      hideAnswer();
      returning = true;
      vx = (Math.random() - 0.5) * 20;
      vy = (Math.random() - 0.5) * 20;
      startPhysics();
    }

    // ── Device Motion Shake Detection ─────────────────────────────────────────
    const SHAKE_THRESHOLD = 18;
    const SHAKE_COOLDOWN  = 1200;
    let lastShakeTime = 0;
    let lastAcc = { x: null, y: null, z: null };

    function handleMotion(e) {
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;
      const { x, y, z } = acc;
      if (lastAcc.x === null) { lastAcc = { x, y, z }; return; }
      const delta = Math.abs(x - lastAcc.x) + Math.abs(y - lastAcc.y) + Math.abs(z - lastAcc.z);
      lastAcc = { x, y, z };
      const now = Date.now();
      if (delta > SHAKE_THRESHOLD && now - lastShakeTime > SHAKE_COOLDOWN) {
        lastShakeTime = now;
        if (document.getElementById("panel-magic").classList.contains("active")) {
          shake8Ball(true);
        }
      }
    }

    function startDeviceMotion() {
      window.addEventListener("devicemotion", handleMotion, { passive: true });
      document.getElementById("magic-hint").textContent = "Drag & release or shake your device — answer reveals on return";
      document.getElementById("shake-permission-btn").classList.remove("visible");
    }

    function requestShakePermission() {
      if (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission()
          .then(state => { if (state === "granted") startDeviceMotion(); })
          .catch(console.warn);
      } else {
        startDeviceMotion();
      }
    }

    (function initShake() {
      if (typeof DeviceMotionEvent === "undefined") {
        document.getElementById("magic-hint").textContent = "Drag the ball and let go — it'll snap back with your answer";
        return;
      }
      if (typeof DeviceMotionEvent.requestPermission === "function") {
        document.getElementById("shake-permission-btn").classList.add("visible");
        document.getElementById("magic-hint").textContent = "Enable shake, or drag & throw the ball";
      } else {
        startDeviceMotion();
      }
    })();

    // ── Mouse shake detection (desktop) ───────────────────────────────────────
    const MOUSE_REVERSAL_NEEDED = 4;
    const MOUSE_WINDOW_MS       = 600;
    const MOUSE_MIN_DELTA       = 30;
    let mouseHistory = [];
    let lastMouseDir = 0;
    let reversals    = 0;

    document.addEventListener("mousemove", (e) => {
      if (!document.getElementById("panel-magic").classList.contains("active")) return;
      if (dragging) return;
      const now = Date.now();
      mouseHistory.push({ x: e.clientX, t: now });
      mouseHistory = mouseHistory.filter(p => now - p.t < MOUSE_WINDOW_MS);
      if (mouseHistory.length < 2) return;
      const prev = mouseHistory[mouseHistory.length - 2];
      const curr = mouseHistory[mouseHistory.length - 1];
      const dx   = curr.x - prev.x;
      if (Math.abs(dx) < 4) return;
      const dir = dx > 0 ? 1 : -1;
      if (lastMouseDir !== 0 && dir !== lastMouseDir) reversals++;
      lastMouseDir = dir;
      const span = Math.max(...mouseHistory.map(p => p.x)) - Math.min(...mouseHistory.map(p => p.x));
      if (reversals >= MOUSE_REVERSAL_NEEDED && span >= MOUSE_MIN_DELTA) {
        const now2 = Date.now();
        if (now2 - lastShakeTime > SHAKE_COOLDOWN) {
          lastShakeTime = now2;
          reversals = 0; mouseHistory = [];
          shake8Ball(true);
        }
      }
      if (mouseHistory.length <= 1) { reversals = 0; lastMouseDir = 0; }
    });

    // ── Dark mode ──────────────────────────────────────────────────────────────
    const toggleBtn = document.getElementById("toggleBtn");
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.body.classList.add("dark");
      toggleBtn.textContent = "☀️ Light";
    }
    function toggleDark() {
      document.body.classList.toggle("dark");
      toggleBtn.textContent = document.body.classList.contains("dark") ? "☀️ Light" : "🌙 Dark";
    }

    // ── Tab switching ──────────────────────────────────────────────────────────
    function switchTab(name, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("panel-" + name).classList.add("active");
      if (name === "magic") { requestAnimationFrame(() => { initBallPos(); startPhysics(); }); }
    }

    // Init ball when page loads (arena may be hidden, use rAF after first render)
    window.addEventListener("load", () => {
      // Only init if magic tab is default visible — it's not, so we init on first switch
      // But if someone directly opens the magic panel, handle it:
      if (document.getElementById("panel-magic").classList.contains("active")) {
        requestAnimationFrame(() => { initBallPos(); startPhysics(); });
      }
    });

    // ── Number Generator ───────────────────────────────────────────────────────
    function generate() {
      const min = Number(document.getElementById("min").value);
      const max = Number(document.getElementById("max").value);
      const result = document.getElementById("result");
      if (isNaN(min) || isNaN(max) || min > max) {
        result.textContent = "Invalid range"; result.className = "error"; return;
      }
      result.className = "";
      result.textContent = Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ── Coin Flip ──────────────────────────────────────────────────────────────
    let flipping = false;
    function flipCoin() {
      if (flipping) return;
      flipping = true;
      const coin = document.getElementById("coin");
      const label = document.getElementById("coin-label");
      const flipBtn = document.getElementById("flip-btn");
      const isHeads = Math.random() < 0.5;
      coin.style.setProperty("--end-rot", (isHeads ? 1440 : 1620) + "deg");
      coin.classList.remove("land-heads", "land-tails", "flipping");
      label.textContent = "...";
      flipBtn.disabled = true;
      void coin.offsetWidth;
      coin.classList.add("flipping");
      setTimeout(() => {
        coin.classList.remove("flipping");
        coin.classList.add(isHeads ? "land-heads" : "land-tails");
        label.textContent = isHeads ? "Heads!" : "Tails!";
        flipBtn.disabled = false;
        flipping = false;
      }, 950);
    }
  </script>
</body>
</html>
